<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 회사소개 영상</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .page{
      max-width:980px;
      margin:0 auto;
      padding:16px;
    }
    .back-home{
      display:inline-block;
      margin-bottom:10px;
      font-size:14px;
      font-weight:800;
      color:#00B5EF;
      text-decoration:none;
    }
    h1{
      font-size:20px;
      margin:6px 0 12px;
    }
    .video-frame{
      position:relative;
      width:100%;
      padding-top:56.25%; /* 16:9 */
      border-radius:16px;
      overflow:hidden;
      border:1px solid #e6e8eb;
      background:#000;
      box-shadow:0 8px 20px rgba(0,0,0,.10);
    }
    .video-frame iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }
    .note{
      margin-top:12px;
      font-size:12px;
      opacity:.75;
    }
    .company-message{
      margin-top:24px;
      padding:18px;
      background:#ffffff;
      border-radius:16px;
      border:1px solid #e6e8eb;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
    }

    .company-message ul{
      margin:0;
      padding:0;
      list-style:none;
    }

    .company-message li{
      font-size:14px;
      line-height:1.8;
      margin-bottom:8px;
      padding-left:16px;
      position:relative;
    }

    .company-message li::before{
      content:"•";
      position:absolute;
      left:0;
      color:#00B5EF;
      font-weight:bold;
    }

    .company-slogan{
      margin-top:14px;
      padding-top:14px;
      border-top:1px solid #e6e8eb;
      font-size:16px;
      font-weight:900;
      text-align:center;
      color:#00B5EF;
    }

  </style>
</head>
<body>
  <div class="page">
    <a class="back-home" href="/index.html">← 홈으로</a>
    <h1>2026 회사소개</h1>

    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/FICcKt3vEJg"
        title="2026 회사소개 영상"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>

    <div class="note">※ 와이파이 환경에서 시청을 권장합니다.</div>

    <!-- ✅ 여기부터 추가 -->
    <div class="company-message">
      <ul>
        <li>올바른 원칙을 세우고 변함없이 지켜온 기업</li>
        <li>원칙을 지키며 새로운 유통문화를 만들어가는 기업</li>
        <li>세계인의 신뢰를 받으며 글로벌로 뻗어나가는 기업</li>
        <li>고객감동을 넘어 고객의 성공을 꿈꾸는 기업</li>
        <li>영혼을 소중히 여기는 기업</li>
      </ul>

      <div class="company-slogan">
        우리는 자랑스러운 애터미입니다.
      </div>
    </div>
    <!-- ✅ 여기까지 -->

  </div>
</body>

</html>
